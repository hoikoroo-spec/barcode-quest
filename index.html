:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#f1f5ff;background:#0b1426}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -20%,#314b7d 0,transparent 48%),#0b1426}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:540px;margin:auto;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{font-size:19px;font-weight:900;letter-spacing:.07em;color:#ffe1a2}.sub{font-size:11px;color:#9eb3d2}.pill{border:1px solid #445a81;border-radius:99px;padding:7px 10px;font-size:12px;color:#d6e3fa}.hero{border:1px solid #50638a;background:linear-gradient(130deg,#263d67,#152541);border-radius:22px;padding:22px;box-shadow:0 12px 36px #03091570}.hero h1{font-size:27px;line-height:1.4;margin:4px 0 8px}.hero p{color:#c1cde1;font-size:13px;line-height:1.7;margin:0}.eyebrow{color:#f8d38b;font-weight:800;font-size:12px;letter-spacing:.1em}.hero-art{font-size:55px;letter-spacing:10px;text-align:center;padding:14px 0 6px;filter:drop-shadow(0 4px 9px #050b18)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{border:1px solid #405576;background:#1b2b49;color:white;text-align:left;border-radius:17px;padding:16px;min-height:112px}.tile .emoji{font-size:30px;display:block;margin-bottom:9px}.tile b{display:block;font-size:15px}.tile small{color:#aebfda;font-size:11px;display:block;margin-top:5px}.section{margin:20px 0 11px;font-size:17px}.panel{background:#182943;border:1px solid #344d70;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#aebfda;font-size:12px;line-height:1.7}.primary,.secondary,.danger{border:0;border-radius:13px;padding:13px 15px;font-weight:800;color:#132039;background:#ffd58a}.secondary{background:#314a6f;color:#eaf0ff;border:1px solid #567099}.danger{background:#713448;color:#fff}.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1}.field{width:100%;border:1px solid #597298;background:#101e34;color:white;border-radius:12px;padding:13px;font-size:17px;margin:8px 0 10px}.field::placeholder{color:#8196b8}.back{background:none;border:0;color:#c8d8f4;padding:8px 0 16px;font-weight:700}.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px}.headrow h2{margin:0;font-size:22px}.tag{background:#354e70;color:#d6e7ff;border-radius:99px;font-size:11px;padding:5px 9px;display:inline-block}.monster{font-size:91px;text-align:center;padding:10px 0;filter:drop-shadow(0 9px 9px #030918)}.monster.big{font-size:118px}.monstercard{border:1px solid #455e81;background:linear-gradient(150deg,#2b4268,#17263f);border-radius:20px;padding:18px;text-align:center}.monstercard h2{margin:4px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:13px 0}.stat{background:#0e1c33;border-radius:9px;padding:9px 3px;text-align:center}.stat span{font-size:10px;color:#b3c6e4;display:block}.stat b{font-size:17px}.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.collect-item{border:1px solid #3b5478;background:#1d304e;border-radius:14px;padding:12px 4px;text-align:center;color:#fff;min-height:120px}.collect-item .pic{font-size:43px;display:block}.collect-item b{display:block;font-size:12px;margin-top:6px}.collect-item small{color:#b4c8e4;font-size:10px}.bar{height:9px;border-radius:99px;background:#354b66;overflow:hidden;margin:6px 0}.bar>div{height:100%;background:linear-gradient(90deg,#6ce5bd,#78b8ff)}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#101d33ef;border-top:1px solid #344762;padding:10px 8px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(12px);z-index:10}.nav-inner{width:min(540px,100%);display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#9bb0ce;font-size:11px;min-width:65px;padding:4px}.nav button.active{color:#ffd58a}.nav button span{display:block;font-size:23px;margin-bottom:3px}.map{display:grid;gap:2px;background:#101b29;border:3px solid #263b53;padding:5px;border-radius:12px;aspect-ratio:1;max-width:420px;margin:auto}.cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:clamp(9px,3vw,20px);border-radius:2px;min-width:0}.wall{background:#2d3c4a}.floor{background:#597960}.unknown{background:#142132}.controls{display:grid;grid-template-columns:repeat(3,58px);gap:7px;justify-content:center;margin:16px auto}.controls button{height:50px;border-radius:12px;background:#314e74;color:#fff;border:1px solid #5e7fa8;font-size:24px}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.battle{background:linear-gradient(#263c63,#1a2a43);border:1px solid #536d92;border-radius:18px;padding:14px;text-align:center}.battle .enemy{font-size:83px;padding:18px 0}.battle .allies{display:flex;justify-content:space-around;font-size:37px;margin:15px 0}.log{background:#101d32;border-radius:12px;padding:12px;min-height:60px;font-size:13px;line-height:1.6}.choice{background:#213653;color:#fff;border:1px solid #536c91;border-radius:11px;padding:11px}.choice.selected{border-color:#ffdb9d;background:#3b4b63}.itemrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #354c68;padding:11px 0}.itemrow:last-child{border:0}video{width:100%;border-radius:13px;background:#000;max-height:300px;object-fit:cover}.notice{color:#ffe0a0;font-size:12px;line-height:1.6}.hidden{display:none!important}#toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:100px;background:#ffdb98;color:#17243a;padding:12px 17px;border-radius:13px;font-weight:800;max-width:90%;box-shadow:0 6px 24px #0008;display:none;text-align:center}.sprite{image-rendering:pixelated}.sep{height:1px;background:#3b5270;margin:14px 0}@media(min-width:600px){.app{padding-top:30px}}
</style></head><body><main id="app" class="app"></main><div id="toast"></div><script>
'use strict';const SAVE='barcode-quest-v1';const ICONS=['🦊','🐉','🐢','🐿️','🦎','🫧','🍄','🐰','🔥','🐟','🌱','⚡','🦁','🦀','🦌','🦅','🐺','🐧','🦋','🦂','🦄','🐙','🌳','🦖'];const NAMES=['ヒノコ','アクアドラゴン','モリガメ','ライリス','マグトカゲ','アワプル','キノポン','イナズマウサギ','フレアウィスプ','シオヒレ','コノハシカ','ピカビート','エンジシ','カイガード','リーフディア','ライチョウ','ホムラオオカミ','コオリペン','ハナチョウ','ビリサソリ','セイエン','シンカイ','モクジュ','ライリュウ'];const ELEMENTS=['炎','水','草','雷'];const BOSS_NAMES=['森王ユグドラ','炎帝フェニクス','氷海リヴァイア','雷皇ヴォルテス'];const BOSS_ICONS=['🌳','🦅','🐲','🐲'];const THEMES=['森の迷宮','火山の洞窟','氷の神殿','古城の遺跡'];const FLOORS=[3,4,5,7,10];const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619)>>>0;return h>>>0}function rng(seed){let x=seed>>>0;return ()=>{x=(x+0x6D2B79F5)>>>0;let t=Math.imul(x^(x>>>15),1|x);t^=t+Math.imul(t^(t>>>7),61|t);return ((t^(t>>>14))>>>0)/4294967296}}function defaultState(){return {monsters:[],dungeons:[],party:[],items:{potion:5,stone:0,shards:0},gold:0,active:null,seen:{},cleared:{},bossOwned:{}}}let state;try{state=Object.assign(defaultState(),JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch{state=defaultState()}let page='home',mode='monster',selected=null,detail=null,scanStream=null,scanTimer=null,scanReader=null,battle=null;function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch{toast('保存できません。ストレージ容量を確認してね')}}function toast(s){const e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2700)}function isValid(s){return /^\d{8}$|^\d{12,14}$/.test(s)}function isEAN(s){if(![8,12,13,14].includes(s.length))return false;let sum=0;for(let i=s.length-2,k=0;i>=0;i--,k++)sum+=Number(s[i])*(k%2===0?3:1);return (10-sum%10)%10===Number(s.at(-1))}function createMonster(code){let h=hash('monster-v1:'+code),r=rng(h),idx=Math.floor(r()*24),quality=Math.floor(r()*100);return {id:'m-'+code,code,idx,name:NAMES[idx],icon:ICONS[idx],element:ELEMENTS[idx%4],rarity:quality<55?1:quality<80?2:quality<94?3:quality<99?4:5,level:1,xp:0,atk:18+Math.floor(r()*19),def:16+Math.floor(r()*19),speed:15+Math.floor(r()*19),maxHp:75+Math.floor(r()*40),hp:0,training:{atk:0,def:0},stage:0,branch:null,boss:false}}function bossMonster(theme){return {id:'boss-'+theme,code:'BOSS',idx:24+theme,name:BOSS_NAMES[theme],icon:BOSS_ICONS[theme],element:ELEMENTS[[2,0,1,3][theme]],rarity:5,level:30,xp:0,atk:65,def:60,speed:48,maxHp:240,hp:240,training:{atk:0,def:0},stage:2,branch:null,boss:true}}function dungeonFor(code){let h=hash('dungeon-v1:'+code),r=rng(h),theme=Math.floor(r()*4),difficulty=1+Math.floor(r()*5);return {id:'d-'+code,code,theme,difficulty,floors:FLOORS[difficulty-1],name:THEMES[theme],seed:h}}function getMonster(id){return state.monsters.find(m=>m.id===id)}function monsterName(m){if(m.boss)return m.name;if(m.stage===0)return m.name;if(m.stage===1)return m.name+'・改';return m.name+(m.branch==='atk'?'・烈':'・護')}function stars(n){return '★'.repeat(n)}function bar(n,max){return `<div class="bar"><div style="width:${Math.max(0,Math.min(100,n/max*100))}%"></div></div>`}function nav(){return `<div class="nav"><div class="nav-inner">${[['home','🏠','ホーム'],['scan','📷','スキャン'],['dungeons','🗺️','迷宮'],['collection','📖','図鑑'],['party','⚔️','編成']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('')}</div></div>`}function frame(content,title){$('#app').innerHTML=`<div class="top"><div><div class="brand">✦ BARCODE QUEST</div><div class="sub">バーコードから始まる冒険</div></div><div class="pill">図鑑 ${state.monsters.length}体</div></div>${title?`<button class="back" onclick="go('home')">‹ ホームへ</button><div class="headrow"><h2>${title}</h2></div>`:''}${content}${nav()}`}function go(p){stopCamera();page=p;selected=null;render()}function render(){if(page==='home')home();else if(page==='scan')scan();else if(page==='collection')collection();else if(page==='party')party();else if(page==='dungeons')dungeons();else if(page==='detail')monsterDetail();else if(page==='explore')explore();else if(page==='battle')battleView();else if(page==='result')resultView()}function home(){frame(`<div class="hero"><div class="eyebrow">YOUR ADVENTURE STARTS HERE</div><h1>バーコードに眠る<br>冒険を解き放て。</h1><p>身近なバーコードから仲間を召喚。未知の迷宮を探索して、伝説のモンスターを手に入れよう。</p><div class="hero-art">🦊 🐉 🌳</div></div><h3 class="section">冒険メニュー</h3><div class="grid2"><button class="tile" onclick="setMode('monster')"><span class="emoji">✨</span><b>モンスター召喚</b><small>バーコードから仲間を発見</small></button><button class="tile" onclick="setMode('dungeon')"><span class="emoji">🏰</span><b>ダンジョン生成</b><small>新しい迷宮を発見</small></button><button class="tile" onclick="go('dungeons')"><span class="emoji">🗺️</span><b>冒険に出る</b><small>迷宮を自由に探索</small></button><button class="tile" onclick="go('collection')"><span class="emoji">📖</span><b>モンスター図鑑</b><small>仲間を確認・育成</small></button></div><div class="panel"><div class="headrow"><b>冒険の記録</b><span class="tag">試作版 v0.1</span></div><p class="muted">仲間 ${state.monsters.length}体 ／ 発見した迷宮 ${state.dungeons.length}個 ／ 攻略済み ${Object.keys(state.cleared).length}件</p><div class="actions"><button class="secondary" onclick="exportSave()">💾 セーブを書き出す</button><button class="secondary" onclick="$('#importFile').click()">📂 読み込む</button></div><input id="importFile" class="hidden" type="file" accept="application/json,.json" onchange="importSave(event)"></div>`,false)}function setMode(m){mode=m;page='scan';render()}function scan(){frame(`<div class="panel"><div class="actions"><button class="${mode==='monster'?'primary':'secondary'}" onclick="setMode('monster')">✨ モンスター召喚</button><button class="${mode==='dungeon'?'primary':'secondary'}" onclick="setMode('dungeon')">🏰 ダンジョン生成</button></div><p class="muted">${mode==='monster'?'バーコードの数字から仲間を召喚しよう！':'バーコードの数字から新しい迷宮を発見しよう！'}</p><video id="camera" playsinline muted autoplay class="hidden"></video><p id="camInfo" class="muted">カメラで読み取るか、下の欄に数字を入力してね。</p><button class="secondary full" id="camBtn" onclick="startCamera()">📷 カメラを起動して読み取る</button><div class="sep"></div><label class="muted">バーコードの数字（EAN-8 / UPC-A / EAN-13 / ITF-14）</label><input id="code" class="field" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="例：4901234567894"><button class="primary full" onclick="summon()">${mode==='monster'?'✨ モンスターを召喚':'🏰 ダンジョンを生成'}</button><p class="muted">※ 同じ数字からは同じ結果が出るよ。チェックデジットが正しいバーコードのみ使用できるよ。</p></div><div id="scanResult"></div>`,mode==='monster'?'モンスター召喚':'ダンジョン生成')}function summon(){let code=$('#code').value.replace(/\s/g,'');if(!isValid(code)||!isEAN(code)){toast('正しい8・12・13・14桁のバーコードを入力してね');return}stopCamera();if(mode==='monster'){let old=state.monsters.find(m=>m.code===code);if(old){$('#scanResult').innerHTML=`<div class="panel"><b>召喚済みのバーコード！</b><p class="muted">${esc(monsterName(old))}はすでに仲間だよ。</p><button class="secondary full" onclick="openMonster('${old.id}')">仲間を確認</button></div>`;return}let m=createMonster(code);m.hp=m.maxHp;state.monsters.push(m);if(state.party.length<3)state.party.push(m.id);save();$('#scanResult').innerHTML=`<div class="monstercard"><div class="eyebrow">✦ NEW MONSTER ✦</div><div class="monster">${m.icon}</div><h2>${esc(m.name)}</h2><div class="tag">${m.element}属性 ・ ${stars(m.rarity)}</div><div class="stats">${[['HP',m.maxHp],['攻撃',m.atk],['防御',m.def],['速さ',m.speed]].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div><button class="primary full" onclick="openMonster('${m.id}')">図鑑で見る</button></div>`;toast('新しいモンスターが仲間になった！')}else{let d=dungeonFor(code),old=state.dungeons.some(x=>x.id===d.id);if(!old)state.dungeons.push(d);save();$('#scanResult').innerHTML=`<div class="panel"><div class="eyebrow">${old?'発見済みの迷宮':'✦ NEW DUNGEON ✦'}</div><h2>${['🌲','🌋','❄️','🏰'][d.theme]} ${d.name}</h2><p>${stars(d.difficulty)} ／ ${d.floors}階 ／ 推奨Lv.${d.difficulty*10-5}</p><button class="primary full" onclick="startDungeon('${d.id}')">🗺️ この迷宮へ出発</button></div>`;toast(old?'同じ迷宮を発見！':'新しい迷宮を発見！')}}function collection(){let content=state.monsters.length?`<div class="collection">${state.monsters.map(m=>`<button class="collect-item" onclick="openMonster('${m.id}')"><span class="pic">${m.icon}</span><b>${esc(monsterName(m))}</b><small>Lv.${m.level}・${m.element}・${stars(m.rarity)}</small></button>`).join('')}</div>`:`<div class="panel"><p>まだモンスターがいないよ。</p><button class="primary full" onclick="setMode('monster')">最初のモンスターを召喚</button></div>`;frame(`<p class="muted">仲間 ${state.monsters.length}体。タップすると能力・育成・進化を確認できるよ。</p>${content}`, 'モンスター図鑑')}function openMonster(id){detail=id;page='detail';render()}function monsterDetail(){let m=getMonster(detail);if(!m){go('collection');return}let next=30+m.level*15;frame(`<div class="monstercard"><div class="eyebrow">MONSTER COLLECTION</div><div class="monster big">${m.icon}</div><h2>${esc(monsterName(m))}</h2><div class="tag">${m.element}属性 ・ ${stars(m.rarity)} ・ Lv.${m.level}</div><p class="muted">${m.boss?'ダンジョンの最深部から仲間になった伝説の守護獣。':'バーコードに眠っていた不思議な生命。育て方で進化が変わる。'}</p><div class="stats">${[['HP',m.maxHp],['攻撃',m.atk],['防御',m.def],['速さ',m.speed]].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div><div class="panel"><b>成長・進化</b><p class="muted">経験値 ${m.xp} / ${next}　${m.boss?'・ボス限定':'・進化 Lv.15 / Lv.30'}</p>${bar(m.xp,next)}<p class="muted">攻撃育成 ${m.training.atk} ／ 防御育成 ${m.training.def}</p>${!m.boss?`<div class="actions"><button class="secondary" onclick="train('${m.id}','atk')">⚔️ 攻撃訓練</button><button class="secondary" onclick="train('${m.id}','def')">🛡️ 防御訓練</button></div><p class="muted">訓練は10ゴールド消費。Lv.30で育成ポイントの多い方向に進化する。</p>${m.stage===2?`<button class="secondary full" onclick="rebranch('${m.id}')">💎 進化の秘石で分岐変更（所持 ${state.items.stone}）</button>`:''}`:''}</div><div class="panel"><div class="actions"><button class="primary" onclick="toggleParty('${m.id}')">${state.party.includes(m.id)?'編成から外す':'パーティーに加える'}</button><button class="secondary" onclick="go('collection')">図鑑に戻る</button></div></div>`,'モンスター詳細')}function train(id,type){let m=getMonster(id);if(state.gold<10){toast('訓練には10ゴールド必要だよ');return}state.gold-=10;m.training[type]+=3;save();render();toast(type==='atk'?'攻撃育成 +3':'防御育成 +3')}function rebranch(id){let m=getMonster(id);if(state.items.stone<1){toast('進化の秘石が足りないよ');return}if(!confirm('進化の秘石を1個使って、最終進化を切り替える？'))return;state.items.stone--;m.branch=m.branch==='atk'?'def':'atk';save();render();toast('進化先を変更した！')}function toggleParty(id){if(state.party.includes(id))state.party=state.party.filter(x=>x!==id);else if(state.party.length>=3){toast('パーティーは3体までだよ');return}else state.party.push(id);save();render()}function party(){frame(`<div class="panel"><div class="headrow"><b>現在のパーティー</b><span class="tag">${state.party.length}/3体</span></div>${state.party.map(id=>{let m=getMonster(id);return m?`<div class="itemrow"><span style="font-size:32px">${m.icon}</span><div style="flex:1"><b>${esc(monsterName(m))}</b><div class="muted">Lv.${m.level}・${m.element}・HP ${m.hp}/${m.maxHp}</div></div><button class="secondary" onclick="openMonster('${m.id}')">詳細</button></div>`:''}).join('')||'<p class="muted">仲間を選んで編成しよう。</p>'}</div><div class="panel"><b>冒険の持ち物</b><p class="muted">🪙 ${state.gold} G　🧪 回復薬 ${state.items.potion}個　💎 進化の秘石 ${state.items.stone}個　✨ 欠片 ${state.items.shards}個</p>${state.items.shards>=5?'<button class="primary full" onclick="craftStone()">欠片5個で進化の秘石を合成</button>':''}</div><h3 class="section">仲間一覧</h3><div class="collection">${state.monsters.map(m=>`<button class="collect-item" onclick="openMonster('${m.id}')"><span class="pic">${m.icon}</span><b>${esc(monsterName(m))}</b><small>${state.party.includes(m.id)?'✓ 編成中':'Lv.'+m.level}</small></button>`).join('')}</div>`,'パーティー編成')}function craftStone(){state.items.shards-=5;state.items.stone++;save();render();toast('進化の秘石を合成した！')}function dungeons(){frame(`<p class="muted">見つけたダンジョンから冒険先を選ぼう。進行状況は自動保存されるよ。</p>${state.active?`<div class="panel"><b>▶ 探索中のダンジョン</b><p>${esc(state.active.dungeonName)} B${state.active.floor}F</p><button class="primary full" onclick="go('explore')">探索を再開する</button></div>`:''}${state.dungeons.length?state.dungeons.map(d=>`<div class="panel"><div class="headrow"><b>${['🌲','🌋','❄️','🏰'][d.theme]} ${d.name}</b><span class="tag">${stars(d.difficulty)}</span></div><p class="muted">${d.floors}階・推奨Lv.${d.difficulty*10-5} ／ ${state.cleared[d.id]?'🏆 攻略済み':'未攻略'}</p><button class="secondary full" onclick="startDungeon('${d.id}')">この迷宮を探索</button></div>`).join(''):`<div class="panel"><p>まだダンジョンが見つかっていないよ。</p><button class="primary full" onclick="setMode('dungeon')">バーコードで迷宮を探す</button></div>`}`,'ダンジョン一覧')}function buildMap(seed,size){let r=rng(seed),map=Array.from({length:size},()=>Array(size).fill('#'));let x=1,y=1;map[y][x]='.';let dirs=[[2,0],[-2,0],[0,2],[0,-2]];let stack=[[x,y]];while(stack.length){let [cx,cy]=stack[stack.length-1],choices=dirs.filter(([dx,dy])=>{let nx=cx+dx,ny=cy+dy;return nx>0&&ny>0&&nx<size-1&&ny<size-1&&map[ny][nx]==='#'});if(!choices.length){stack.pop();continue}let [dx,dy]=choices[Math.floor(r()*choices.length)];map[cy+dy/2][cx+dx/2]='.';map[cy+dy][cx+dx]='.';stack.push([cx+dx,cy+dy])}let floor=[];for(let yy=1;yy<size-1;yy++)for(let xx=1;xx<size-1;xx++)if(map[yy][xx]==='.')floor.push([xx,yy]);let dist=Array.from({length:size},()=>Array(size).fill(-1)),q=[[1,1]];dist[1][1]=0;for(let i=0;i<q.length;i++){let [cx,cy]=q[i];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=cx+dx,ny=cy+dy;if(map[ny]?.[nx]==='.'&&dist[ny][nx]===-1){dist[ny][nx]=dist[cy][cx]+1;q.push([nx,ny])}}}floor.sort((a,b)=>dist[b[1]][b[0]]-dist[a[1]][a[0]]);let goal=floor[0],events={};events[goal.join(',')]='stairs';let pool=floor.slice(1).filter(([x,y])=>dist[y][x]>3);for(let [type,count] of [['chest',2],['enemy',Math.max(2,Math.floor(size/5))],['heal',1]])for(let j=0;j<count&&pool.length;j++){let i=Math.floor(r()*pool.length),p=pool.splice(i,1)[0];events[p.join(',')]=type}return {map:map.map(row=>row.join('')),events,goal}}function makeFloor(a){let d=state.dungeons.find(x=>x.id===a.id);let size=[11,13,15,17,21][d.difficulty-1],level=buildMap(hash('floor-v1:'+d.code+':'+a.floor),size);a.map=level.map;a.events=level.events;a.pos=[1,1];a.visited=['1,1'];a.goal=level.goal;a.dungeonName=d.name;a.theme=d.theme;a.difficulty=d.difficulty;a.maxFloors=d.floors;a.code=d.code}function startDungeon(id){if(state.party.length===0){toast('先にモンスターを召喚してパーティーを作ろう');return}if(state.active&&state.active.id!==id&&!confirm('別の迷宮に出発すると、現在の探索が終了するよ。続ける？'))return;if(state.active&&state.active.id===id){go('explore');return}state.active={id,floor:1};makeFloor(state.active);save();go('explore')}function explore(){let a=state.active;if(!a){go('dungeons');return}let d=state.dungeons.find(x=>x.id===a.id),size=a.map.length,seen=new Set(a.visited);let tiles='';for(let y=0;y<size;y++)for(let x=0;x<size;x++){let visible=Math.abs(x-a.pos[0])+Math.abs(y-a.pos[1])<=2,known=visible||seen.has(x+','+y),wall=a.map[y][x]==='#',event=a.events[x+','+y];tiles+=`<div class="cell ${!known?'unknown':wall?'wall':'floor'}">${!known?'':a.pos[0]===x&&a.pos[1]===y?'🧙':wall?'':event==='chest'?'🎁':event==='enemy'?'👾':event==='heal'?'💧':event==='stairs'?(a.floor===a.maxFloors?'🐲':'🪜'):''}</div>`}frame(`<div class="panel"><div class="headrow"><b>${['🌲','🌋','❄️','🏰'][a.theme]} ${a.dungeonName}</b><span class="tag">B${a.floor}F / ${a.maxFloors}F</span></div><p class="muted">歩いた場所から地図が明らかになるよ。🎁 宝箱・👾 敵・🪜 階段を探そう。</p><div class="map" style="grid-template-columns:repeat(${size},1fr)">${tiles}</div><div class="controls"><button class="up" onclick="move(0,-1)">▲</button><button class="left" onclick="move(-1,0)">◀</button><button class="down" onclick="move(0,1)">▼</button><button class="right" onclick="move(1,0)">▶</button></div><div class="actions"><button class="secondary" onclick="usePotion()">🧪 回復薬 (${state.items.potion})</button><button class="danger" onclick="leaveDungeon()">🚪 撤退</button></div></div><div class="panel"><b>冒険中の仲間</b>${state.party.map(id=>{let m=getMonster(id);return m?`<div class="itemrow"><span>${m.icon} ${esc(monsterName(m))}</span><span class="muted">HP ${m.hp}/${m.maxHp}</span></div>`:''}).join('')}</div>`,'自由探索')}function move(dx,dy){let a=state.active;if(!a||page!=='explore')return;let nx=a.pos[0]+dx,ny=a.pos[1]+dy;if(a.map[ny]?.[nx]!==' .'.trim()){return}a.pos=[nx,ny];for(let y=ny-2;y<=ny+2;y++)for(let x=nx-2;x<=nx+2;x++)if(x>=0&&y>=0&&x<a.map.length&&y<a.map.length&&Math.abs(x-nx)+Math.abs(y-ny)<=2){let key=x+','+y;if(!a.visited.includes(key))a.visited.push(key)}let key=nx+','+ny,event=a.events[key];if(event){delete a.events[key];if(event==='chest'){let r=rng(hash(a.code+':'+a.floor+':'+key)),gold=15+Math.floor(r()*40);state.gold+=gold;if(r()>.7){state.items.shards++;toast('宝箱！ '+gold+'G と秘石の欠片を発見！')}else{state.items.potion++;toast('宝箱！ '+gold+'G と回復薬を発見！')}}else if(event==='heal'){state.party.forEach(id=>{let m=getMonster(id);if(m)m.hp=Math.min(m.maxHp,m.hp+Math.ceil(m.maxHp*.45))});toast('回復の泉！ HPが回復した')}else if(event==='enemy'||event==='stairs'&&a.floor===a.maxFloors){startBattle(event==='stairs');save();return}else if(event==='stairs'){a.floor++;makeFloor(a);toast('地下'+a.floor+'階へ！')}}save();render()}function usePotion(){if(state.items.potion<=0){toast('回復薬がないよ');return}let ms=state.party.map(getMonster).filter(Boolean),target=ms.sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(!target||target.hp>=target.maxHp){toast('全員HP満タンだよ');return}state.items.potion--;target.hp=Math.min(target.maxHp,target.hp+65);save();render();toast(target.name+'のHPが65回復！')}function leaveDungeon(){if(!confirm('迷宮から撤退する？ 現在の階の探索は終了するよ。'))return;state.active=null;save();go('dungeons')}function startBattle(isBoss){let a=state.active,d=state.dungeons.find(x=>x.id===a.id),r=rng(hash('battle:'+d.code+':'+a.floor+':'+a.pos.join(',')));let enemyHp=(isBoss?140:45)+d.difficulty*(isBoss?65:22)+a.floor*6;battle={isBoss,enemyHp,enemyMax:enemyHp,enemyAtk:(isBoss?12:6)+d.difficulty*5,enemyIcon:isBoss?BOSS_ICONS[d.theme]:['👹','🦇','🐍','🦂'][Math.floor(r()*4)],enemyName:isBoss?BOSS_NAMES[d.theme]:['ダンジョンゴブリン','やみコウモリ','迷宮ヘビ','洞窟サソリ'][Math.floor(r()*4)],turn:1,guard:false,log:'敵が現れた！ 行動を選ぼう。'};page='battle';render()}function battleView(){if(!battle){go('explore');return}let b=battle;frame(`<div class="battle"><div class="eyebrow">${b.isBoss?'⚠ BOSS BATTLE':'MONSTER BATTLE'}</div><h2>${esc(b.enemyName)}</h2><div class="enemy">${b.enemyIcon}</div><div class="muted">敵 HP ${Math.max(0,b.enemyHp)} / ${b.enemyMax}</div>${bar(b.enemyHp,b.enemyMax)}<div class="allies">${state.party.map(id=>getMonster(id)?.icon||'').join('')}</div><div class="log">${esc(b.log)}</div></div><div class="panel"><b>味方の状態</b>${state.party.map(id=>{let m=getMonster(id);return m?`<div class="itemrow"><span>${m.icon} ${esc(monsterName(m))}</span><span class="muted">${m.hp}/${m.maxHp} HP</span></div>`:''}).join('')}<p class="muted">各ターン、戦える味方全員が行動するよ。</p><div class="grid2"><button class="primary" onclick="battleAction('attack')">⚔️ 攻撃</button><button class="secondary" onclick="battleAction('skill')">✨ スキル</button><button class="secondary" onclick="battleAction('guard')">🛡️ 防御</button><button class="secondary" onclick="battleAction('heal')">🧪 回復薬 (${state.items.potion})</button></div></div>`,'バトル')}function battleAction(action){let b=battle;if(!b)return;let allies=state.party.map(getMonster).filter(m=>m&&m.hp>0);if(!allies.length)return;if(action==='heal'){if(!state.items.potion){toast('回復薬がないよ');return}state.items.potion--;let m=allies.sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];m.hp=Math.min(m.maxHp,m.hp+65);b.log=m.name+'のHPを回復！'}else if(action==='guard'){b.guard=true;allies.forEach(m=>m.training.def++);b.log='味方全員が身を守った！'}else{let total=0;for(let m of allies){let damage=Math.max(3,Math.floor(m.atk*(action==='skill'?1.35:.8)+m.level*.7-b.enemyAtk*.18));total+=damage;m.training.atk++}b.enemyHp=Math.max(0,b.enemyHp-total);b.log=(action==='skill'?'必殺技！ ':'総攻撃！ ')+total+'ダメージ！'}if(b.enemyHp<=0){winBattle();return}let alive=state.party.map(getMonster).filter(m=>m&&m.hp>0);let victim=alive[(b.turn-1)%alive.length];let dmg=Math.max(3,Math.floor(b.enemyAtk*(b.guard?.45:1)-victim.def*.16));victim.hp=Math.max(0,victim.hp-dmg);b.log+=' '+victim.name+'は'+dmg+'ダメージを受けた！';b.turn++;b.guard=false;if(!state.party.some(id=>getMonster(id)?.hp>0)){state.active=null;battle=null;state.monsters.forEach(m=>m.hp=Math.max(1,Math.floor(m.maxHp*.5)));save();page='dungeons';render();toast('全滅！ 迷宮から撤退したよ');return}save();render()}function winBattle(){let b=battle,a=state.active,d=state.dungeons.find(x=>x.id===a.id),exp=(b.isBoss?70:18)+d.difficulty*(b.isBoss?28:9),gold=(b.isBoss?100:15)+d.difficulty*12;state.gold+=gold;let levelups=[];for(let id of state.party){let m=getMonster(id);if(!m)continue;m.xp+=exp;while(m.level<50&&m.xp>=30+m.level*15){m.xp-=30+m.level*15;m.level++;m.maxHp+=5;m.atk+=2;m.def+=2;m.speed+=1;m.hp=Math.min(m.maxHp,m.hp+12);if(!m.boss&&m.level===15)m.stage=1;if(!m.boss&&m.level===30){m.stage=2;m.branch=m.training.atk>=m.training.def?'atk':'def';m[m.branch==='atk'?'atk':'def']+=15}levelups.push(m.name+' Lv.'+m.level)}}let bossReward='';if(b.isBoss){state.cleared[d.id]=true;if(d.difficulty===5&&!state.bossOwned[d.theme]){let m=bossMonster(d.theme);state.monsters.push(m);state.bossOwned[d.theme]=true;bossReward=m.name+'が仲間になった！'}else{state.items.shards+=2;bossReward='進化の秘石の欠片 ×2 を入手！'}state.active=null}battle={result:true,exp,gold,levelups,bossReward,isBoss:b.isBoss};save();page='result';render()}function resultView(){let b=battle;frame(`<div class="monstercard"><div class="eyebrow">VICTORY!</div><div class="monster">🏆</div><h2>${b.isBoss?'ダンジョン攻略！':'バトル勝利！'}</h2><p>経験値 +${b.exp} ／ ゴールド +${b.gold}</p>${b.levelups.length?`<p class="notice">レベルアップ：${esc(b.levelups.join('、'))}</p>`:''}${b.bossReward?`<p class="notice">🎉 ${esc(b.bossReward)}</p>`:''}<button class="primary full" onclick="battle=null;go('${b.isBoss?'dungeons':'explore'}')">${b.isBoss?'迷宮一覧へ':'探索に戻る'}</button></div>`,'戦闘結果')}function exportSave(){let blob=new Blob([JSON.stringify({app:'barcode-quest',version:1,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='barcode-quest-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function importSave(e){let f=e.target.files?.[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j.app!=='barcode-quest'||!j.data||!Array.isArray(j.data.monsters)||!Array.isArray(j.data.dungeons))throw Error('形式が違います');if(!confirm('現在のセーブを上書きする？'))return;state=Object.assign(defaultState(),j.data);save();go('home');toast('セーブを読み込んだよ')}catch{toast('正しいセーブファイルを選んでね')}}async function startCamera(){stopCamera();let v=$('#camera'),info=$('#camInfo'),btn=$('#camBtn');if(!navigator.mediaDevices?.getUserMedia){info.textContent='このブラウザではカメラが使えません。数字入力を使ってね。';return}try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=scanStream;v.classList.remove('hidden');await v.play();btn.textContent='📷 カメラを停止';btn.onclick=stopCamera;info.textContent='バーコードを枠の中央に映してね。読み取れない場合は数字を入力してね。';if('BarcodeDetector'in window){let detector=new BarcodeDetector({formats:['ean_8','ean_13','upc_a','itf']});let busy=false;scanTimer=setInterval(async()=>{if(busy||!scanStream)return;busy=true;try{let results=await detector.detect(v);if(results.length){let value=results[0].rawValue;if(isValid(value)&&isEAN(value)){stopCamera();$('#code').value=value;toast('バーコードを読み取ったよ！');summon()}}}catch{}busy=false},450)}else{info.textContent='このブラウザでは自動読み取りが非対応です。数字入力を使ってね。';toast('数字入力で試してみてね')}}catch(e){info.textContent='カメラを開けませんでした。SafariでHTTPSページを開き、カメラを許可してね。';toast('カメラを起動できませんでした')}}function stopCamera(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(scanReader){try{scanReader.reset()}catch{}scanReader=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}let v=$('#camera');if(v){v.srcObject=null;v.classList.add('hidden')}let btn=$('#camBtn');if(btn){btn.textContent='📷 カメラを起動して読み取る';btn.onclick=startCamera}}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
